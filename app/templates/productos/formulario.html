{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if producto else 'Nuevo' }} producto — Agrofalma{% endblock %}

{% block contenido %}
<div class="cabecera-pagina">
    <h1>{{ 'Editar producto' if producto else 'Nuevo producto' }}</h1>
</div>

<div class="tarjeta tarjeta-formulario">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% set v = valores if valores is not none else producto %}

        <label for="codigo_producto">Código de producto</label>
        <input type="text" id="codigo_producto" name="codigo_producto" required
               value="{{ v.codigo_producto if v else '' }}" placeholder="Ej. FOL-004">

        <label for="nombre_producto">Nombre del producto</label>
        <input type="text" id="nombre_producto" name="nombre_producto" required
               value="{{ v.nombre_producto if v else '' }}" placeholder="Ej. Foliar Zinc">

        <div class="fila-formulario">
            <div>
                <label for="id_categoria">Categoría</label>
                <select id="id_categoria" name="id_categoria" required>
                    <option value="">Seleccione...</option>
                    {% for c in categorias %}
                    {% set seleccionada = (v.id_categoria|string == c.id_categoria|string) if v and v.id_categoria else false %}
                    <option value="{{ c.id_categoria }}" {% if seleccionada %}selected{% endif %}>
                        {{ c.nombre_categoria }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="id_unidad">Unidad de medida</label>
                <select id="id_unidad" name="id_unidad" required>
                    <option value="">Seleccione...</option>
                    {% for u in unidades %}
                    {% set seleccionada = (v.id_unidad|string == u.id_unidad|string) if v and v.id_unidad else false %}
                    <option value="{{ u.id_unidad }}" {% if seleccionada %}selected{% endif %}>
                        {{ u.nombre_unidad }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="fila-formulario">
            <div>
                <label for="precio_unitario">Precio unitario (S/)</label>
                <input type="number" step="0.01" min="0" id="precio_unitario" name="precio_unitario" required
                       value="{{ v.precio_unitario if v else '' }}">
            </div>
            <div>
                <label for="stock_minimo">Stock mínimo</label>
                <input type="number" min="0" id="stock_minimo" name="stock_minimo"
                       value="{{ v.stock_minimo if v else 0 }}">
            </div>
        </div>

        <label for="descripcion">Descripción (opcional)</label>
        <textarea id="descripcion" name="descripcion" rows="3">{{ v.descripcion if v and v.descripcion else '' }}</textarea>

        <div class="acciones-formulario">
            <a href="{{ url_for('productos.listar') }}" class="boton-secundario">Cancelar</a>
            <button type="submit" class="boton-primario">Guardar</button>
        </div>
    </form>
</div>
{% endblock %}

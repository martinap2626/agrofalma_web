[pytest]
testpaths = tests
# una función obsoleta (como Query.get o datetime.utcnow) hace fallar las pruebas: así no se acumula deuda técnica
# silenciosa y las actualizaciones de Flask, SQLAlchemy o Python no sorprenden
filterwarnings =
    error::DeprecationWarning
    error::sqlalchemy.exc.SADeprecationWarning
